  <!-- A wax seal with a keyhole: the value is sealed, and only the command that it
       opens for gets in. Strokes only, never <text>, so the README, the favicon, npm,
       Smithery and the Docker catalogue all render it the same. Crimson to amber,
       the colours of sealing wax; codeindex is indigo to cyan and distil violet to
       pink, so the three read as one family and stay apart in a listing. -->
