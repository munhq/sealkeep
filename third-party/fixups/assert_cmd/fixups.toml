cargo_env = true

# The build script writes the target triple into OUT_DIR/current_target.txt, and the crate includes it.
[buildscript.run]
rustc_link_lib = true
rustc_link_search = true
env = { OPT_LEVEL = "0", DEBUG = "false", PROFILE = "debug", TARGET = "x86_64-unknown-linux-gnu", HOST = "x86_64-unknown-linux-gnu" }
