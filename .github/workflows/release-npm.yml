# Publish the npm wrapper (npm/) on a version tag, after release.yml has uploaded
# the binaries that the wrapper downloads.
#
# Authentication: an NPM_TOKEN secret for the first publish (npm has no package
# settings page before the package exists). Then configure Trusted Publishing on
# npmjs.com (Packages -> @munhq/sealkeep -> Settings -> Trusted Publisher: GitHub
# Actions, owner munhq, repo sealkeep, workflow release-npm.yml) and delete the
# secret: the publish step uses the token only while the secret exists, and OIDC
# (id-token: write) after that. OIDC needs Node 22 and npm 11.5.1 or later.
name: release-npm
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check, but do not publish
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: npm new enough for OIDC
        run: npm install -g npm@11.6.2 && npm --version
      - name: The versions agree
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          PKG=$(node -p "require('./npm/package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRVPKG=$(node -p "require('./server.json').packages[0].version")
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          MCPNAME=$(node -p "require('./npm/package.json').mcpName")
          SRVNAME=$(node -p "require('./server.json').name")
          [ "$MCPNAME" = "$SRVNAME" ] || { echo "::error::mcpName $MCPNAME, server.json name $SRVNAME"; exit 1; }
          for v in "$SRV" "$SRVPKG" "$CARGO"; do
            [ "$v" = "$PKG" ] || { echo "::error::versions differ: npm $PKG, server.json $SRV/$SRVPKG, Cargo.toml $CARGO"; exit 1; }
          done
          if [ "$REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME, npm/package.json $PKG"; exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
      - name: The resolver matches the release matrix
        run: node npm/bin/selftest.js
      - name: Wait for the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS; then
              echo "assets are up"; exit 0
            fi
            echo "waiting for $TAG assets ($i/60)"; sleep 20
          done
          echo "::error::the release assets did not appear in 20 minutes"; exit 1
      - name: The wrapper fetches and starts the server
        working-directory: npm
        run: |
          node bin/postinstall.js
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 60 node bin/sealkeep.js > handshake.json
          node -e '
            const line = require("fs").readFileSync("handshake.json", "utf8").split("\n").find(Boolean);
            const got = JSON.parse(line).result.serverInfo;
            const want = require("./package.json").version;
            if (got.name !== "sealkeep" || got.version !== want) {
              console.error(`::error::handshake says ${got.name} ${got.version}, expected sealkeep ${want}`);
              process.exit(1);
            }
            console.log(`handshake ok: ${got.name} ${got.version}`);'
          rm -f handshake.json
      - name: Skip when npm has this version
        id: already
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if npm view "@munhq/sealkeep@$VERSION" version >/dev/null 2>&1; then
            echo "done=true" >> "$GITHUB_OUTPUT"; echo "::notice::@munhq/sealkeep@$VERSION is already on npm"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack (dry run)
        if: inputs.dry_run
        working-directory: npm
        run: npm publish --dry-run --access public
      - name: Publish
        if: "!inputs.dry_run && steps.already.outputs.done != 'true'"
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
