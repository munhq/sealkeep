# One-off transfer of the npm publish token, so that no person or agent ever reads it: each run encrypts the
# repository secret NPM_TOKEN to a public key whose private half stays on one machine, and uploads only the encrypted
# bytes. The artifact of this public repository is useless to anyone else. This workflow is removed straight after the
# copy; it is not a publishing path.
name: copy-npm-token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt the token to the recipient key
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RECIPIENT: |
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAocV+OCkyL1GzurDKmrRD
            kfl0Z9N4OWJk2LitIXCusalYcnfYNMH3KnjE9iLoyxhH4u2teFlHpuNOPWgmCVHS
            39sRF+s0b5m+dU3AkBMZs5EZKNeY7pPzje/T5+Ik3Do2aBYIHhKLxLG8yvGvKAc0
            LCIXebGbeyYn0qpWbbUWoF80r2NzJ56B9lKaiIYVoUMB5YY8VBtYHudH+gxF5f44
            w8JRD/QreVYY4nrV0In1RiKy9b4xJVeFKe8xmM0VFUUVXBI7SRrHpn6/IUt86xNx
            haSXsQh4SDDE079Pnw+CI1JZGT7AE+vXKCWvuX0/JkVrIQZc9rvG29dolZ1fKwkX
            su7s5yVhzK2pa5OKRnu+xD0XwADQX/VBhMB5e64P1xJ5NFDlOWvoHskNWpqaqFLc
            kfJ0s6n91sUOFiC70lg3+F5mcshzyiDElNGtV96omyNFOQXv6EQwj99AG0S7fUhK
            0JBJhXrVgytDebysSiGWs2KEr+wpNiy9Nmz1q0rL9V73AgMBAAE=
            -----END PUBLIC KEY-----
        run: |
          umask 077
          printf '%s\n' "$RECIPIENT" > pub.pem
          printf '%s' "$NPM_TOKEN" | openssl pkeyutl -encrypt -pubin -inkey pub.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out token.enc
          test -s token.enc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: token
          path: token.enc
          retention-days: 1
          if-no-files-found: error
