# On a version tag: build the binaries and attach them, with SHA256SUMS, to a release.
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: sealkeep-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: sealkeep-linux-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: sealkeep-darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: sealkeep-darwin-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: sealkeep-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: The tag matches Cargo.toml
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" = "$TAG"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Rename
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          src="target/$TARGET/release/sealkeep"
          [ -f "$src.exe" ] && src="$src.exe"
          mkdir -p dist && cp "$src" "dist/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum sealkeep-* > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "sealkeep $TAG" \
            --notes "Binaries for Linux, macOS and Windows. The README gives the install command."
